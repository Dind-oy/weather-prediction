<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Prediction</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet" />
    <style>
      /* General Style */
      * {
        font-family: "Poppins";
      }

      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #f8c8dc, #f3f3f3);
        font-family: "Poppins", Arial, sans-serif;
        color: #333;
      }

      h1 {
        margin: 0;
        color: #444;
        font-size: 2.5rem;
        font-weight: 600;
      }

      .alert {
        display: flex;
        justify-content: center;
        text-align: center;
        column-gap: 10px;
      }

      .bi {
        display: flex;
        align-items: center;
      }

      .container {
        width: 90%;
        max-width: 600px;
        margin: 5% auto;
        padding: 40px;
        background: #fff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        text-align: center;
      }

      /* Header Icon */
      .header {
        align-items: center;
        justify-content: center;
        gap: 20px;
      }

      .header img {
        width: 60px;
        animation: float 2s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      /* Input Form */
      form {
        margin-top: 20px;
      }

      .input-group {
        flex-direction: column;
        margin: 10px 0;
        text-align: left;
      }

      .input-group label {
        font-size: 0.9rem;
        font-weight: 600;
        color: #555;
      }

      .input-group input {
        width: 100% !important;
        padding: 12px;
        margin-top: 5px;
        border: 2px solid #ddd;
        border-radius: 25px;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        transition: 0.3s ease-in-out;
        text-align: center;
        font-weight: bold;
        color: #555;
      }

      .input-group input:focus {
        border-color: #ff88a2;
        outline: none;
      }

      .form-control {
        border-radius: 24px !important;
      }

      /* Button */
      .btn {
        margin-top: 15px;
        padding: 12px 30px;
        background-color: #ff88a2;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease-in-out;
      }

      .btn:hover {
        background-color: #ff607f;
        box-shadow: 0 3px 10px rgba(255, 136, 162, 0.4);
        transform: translateY(-2px);
      }

      /* Prediction Result */
      .prediction {
        margin-top: 25px;
        padding: 15px;
        background: linear-gradient(135deg, #ffdaec, #ffedf1);
        color: #333;
        font-weight: 600;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      }

      #weather-img {
        height: 10vh;
        display: flex;
        justify-content: center;
      }

      /* Responsive Design */
      @media (max-width: 600px) {
        h1 {
          font-size: 2rem;
        }
        .input-group input {
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="header">
        <img src="https://img.icons8.com/ios-filled/50/ff88a2/partly-cloudy-day.png" alt="Weather Icon" />
        <h1 class="text-center">Weather APP</h1>
      </div>
      <form id="weather-form">
        <div class="input-group">
          <label for="precipitation" class="form-label"> 🌧 Precipitation (mm)</label>
          <input type="number" step="0.1" class="form-control" id="precipitation" name="precipitation" required />
        </div>
        <div class="input-group">
          <label for="tempMax" class="form-label"> 🌡 Maximum Temperature (°C)</label>
          <input type="number" step="0.1" class="form-control" id="tempMax" name="tempMax" required />
        </div>
        <div class="input-group">
          <label for="tempMin" class="form-label"> 🌡 Minimum Temperature (°C)</label>
          <input type="number" step="0.1" class="form-control" id="tempMin" name="tempMin" required />
        </div>
        <div class="input-group">
          <label for="wind" class="form-label"> 🌬 Wind Speed (km/h)</label>
          <input type="number" step="0.1" class="form-control" id="wind" name="wind" required />
        </div>
        <button type="submit" class="btn btn-primary">Predict</button>
      </form>
      <div id="result" class="mt-4">
        <!-- Result will be displayed here -->
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#weather-form").on("submit", function (event) {
          event.preventDefault();

          // Mengambil data dari form
          const data = {
            precipitation: parseFloat($("#precipitation").val()),
            tempMax: parseFloat($("#tempMax").val()),
            tempMin: parseFloat($("#tempMin").val()),
            wind: parseFloat($("#wind").val()),
          };

          // Kirim request ke API
          $.ajax({
            url: "/api/weather/predict",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(data),
            success: function (response) {
              // Tampilkan hasil prediksi
              if (response.prediction) {
                var weatherIcon;

                switch (response.prediction.toLowerCase()) {
                  case "sun":
                    weatherIcon = '<i class="bi bi-sun-fill"></i>';
                    break;
                  case "drizzly":
                    weatherIcon = '<i class="bi bi-cloud-drizzle-fill"></i>';
                    break;
                  case "rain":
                    weatherIcon = '<i class="bi bi-cloud-rain-fill"></i>';
                    break;
                  case "snow":
                    weatherIcon = '<i class="bi bi-snow3"></i>';
                    break;
                  default:
                    weatherIcon = '<i class="bi bi-question-circle"></i>';
                    break;
                }
                $("#result").html(`
                          <div class="alert alert-success">
                            Prediction: ${response.prediction} ${weatherIcon} 
                          </div>
                      `);
              } else if (response.error) {
                $("#result").html(`
                          <div class="alert alert-danger">
                            <i class="bi bi-exclamation-circle"></i>
                              Error: ${response.error}
                          </div>
                      `);
              }
            },
            error: function (xhr, status, error) {
              $("#result").html(`
                      <div class="alert alert-danger">
                        <i class="bi bi-exclamation-circle"></i>
                          Error: ${error}
                      </div>
                  `);
            },
          });
        });
      });
    </script>
  </body>
</html>
